dataset_name: tcga
model_name: tcga
latent_size: 256
modalities:
  - name: dna_methyl
    input_size: 2500
    hidden_size: 3000
  - name: gene_expr
    input_size: 2500
    hidden_size: 3000
  - name: mirna_expr
    input_size: 542
    hidden_size: 800
training_mode: supervised
num_classes: 16
batch_size: 32
num_epochs: 20
generators_lr: 1e-4
discriminator_lr: 1e-4
beta: 5e-4
beta1: 0.5
lambda_r: 10.0
device: auto
save_checkpoint: true