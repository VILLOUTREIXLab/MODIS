[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "modis"
version = "0.0.1"
description = "Multimodal data integration"
authors = [{ name = "Daniel", email = "dlsoltero@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "torch",
    "jupyterlab",
    "omegaconf",
    "numpy",
    "scikit-learn",
    "pandas",
    "matplotlib",
    "plotly",
    "kaleido",
    "seaborn",
    "tensorboard",
    "standard-imghdr"
]

[tool.setuptools.packages.find]
include = ["modis", "modis.*"]
where = ["."]
